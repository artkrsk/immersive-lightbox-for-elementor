<style>
  /* A native scroll-driven parallax contract, reproduced 1:1
     (drift via `translate` keyframes, overscan via the `scale` property
     derived from the factors, frame = clip box, wrapper = timeline owner). */
  @keyframes arts-parallax-drift {
    from {
      translate: calc(var(--arts-parallax-drift-dx, 0) * -100%)
        calc(var(--arts-parallax-drift-dy, 0) * -100%);
    }
    to {
      translate: calc(var(--arts-parallax-drift-dx, 0) * 100%)
        calc(var(--arts-parallax-drift-dy, 0) * 100%);
    }
  }

  .arts-parallax {
    position: relative;
    display: block;
    view-timeline: --arts-parallax block;
  }

  .arts-parallax__frame {
    display: block;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
  }

  .arts-parallax__inner {
    --arts-parallax-drift-dx: var(--arts-parallax-dx, 0);
    --arts-parallax-drift-dy: var(--arts-parallax-dy, 0);
    --arts-parallax-overscan: calc(
      1 + 2 *
        max(
          var(--arts-parallax-dx, 0),
          -1 * var(--arts-parallax-dx, 0),
          var(--arts-parallax-dy, 0),
          -1 * var(--arts-parallax-dy, 0)
        )
    );
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    scale: var(--arts-parallax-overscan);
    translate: 0 0;
    animation: arts-parallax-drift auto linear both;
    animation-timeline: --arts-parallax;
    animation-range: cover;
  }

  .demo-scroll-spacer {
    display: grid;
    place-items: center;
    height: 38vh;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.4;
  }
</style>

<div class="demo-scroll-spacer">scroll — the parallax drifts and overscans</div>
