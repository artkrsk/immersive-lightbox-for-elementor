<div class="demo-grid">
  <a
    href="https://picsum.photos/id/1024/2400/1600"
    data-arts-lightbox
    data-arts-lightbox-group="mixed-captions"
    data-arts-lightbox-caption="Short one"
  >
    <img src="https://picsum.photos/id/1024/600/400" width="600" height="400" alt="Short caption" />
  </a>
  <a
    href="https://picsum.photos/id/1025/2400/1600"
    data-arts-lightbox
    data-arts-lightbox-group="mixed-captions"
    data-arts-lightbox-caption="A deliberately long caption that runs to several lines, so the crossfade can be judged where a tall block of text meets a short one — they share a bottom edge and grow upward, which is the interaction worth eyeballing rather than reasoning about."
  >
    <img src="https://picsum.photos/id/1025/600/400" width="600" height="400" alt="Long caption" />
  </a>
  <!-- Genuinely captionless: alt must be empty, because the caption falls back
       to <figcaption> and then to the thumb's alt text. -->
  <a
    href="https://picsum.photos/id/1027/2400/1600"
    data-arts-lightbox
    data-arts-lightbox-group="mixed-captions"
  >
    <img src="https://picsum.photos/id/1027/600/400" width="600" height="400" alt="" />
  </a>
  <a
    href="https://picsum.photos/id/1029/2400/1600"
    data-arts-lightbox
    data-arts-lightbox-group="mixed-captions"
    data-arts-lightbox-caption="Two lines is the common case for a real gallery caption, long enough to wrap but not to dominate."
  >
    <img src="https://picsum.photos/id/1029/600/400" width="600" height="400" alt="Two-line caption" />
  </a>
</div>
