name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref: only the newest push's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@main
    with:
      # 143 KB actual (100 KB plus the prefixed arts/base) — 0.15 MB leaves ~11 KB headroom
      zip_budget_mb: '0.15'
      coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
